## Codecov Configuration
## See: https://docs.codecov.com/docs/codecov-yaml

# Coverage requirements for the project
coverage:
  # Fail CI if overall coverage is less than 80%
  precision: 2
  round: down
  range: "80...100"
  status:
    # Patch coverage: new code must have 80%+ coverage
    patch:
      default:
        target: 80%
        threshold: null  # Don't allow any drop
        flags: []

    # Project overall coverage: must be at least 80%
    project:
      default:
        target: 80%
        threshold: null  # Don't allow any drop
        flags: []

# Parsers to use for coverage reports
parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

# Ignore files/paths from coverage
ignore:
  - "node_modules"
  - "dist"
  - ".next"
  - "coverage"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.test.js"
  - "**/*.spec.js"
  - "**/index.ts"  # Re-exports only

# Comment on PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default  # Post once per commit
  require_changes: false
  require_base: yes
  require_head: yes
  hide_project_coverage: false

# Fixes
fixes:
  - "parsers/gcov/regex"
  - "carriage_return"
  - "trailing_carriage_return"

# GitHub integration
github:
  require_ci_to_pass: yes

# Notifications
require:
  coverage: yes

# Codecov bot will check PRs for coverage requirements
pr:
  require_ci_to_pass: true
