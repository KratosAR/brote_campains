version: 2

updates:
  # npm/pnpm dependencies
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "-"
    reviewers:
      - "Gonza Mendoza"
    assignees:
      - "Gonza Mendoza"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "[INFRA] chore(deps)"
      prefix-development: "[INFRA] chore(deps-dev)"
      include: "scope"
    allow:
      - dependency-type: all
    ignore:
      # Ignore major versions of known problem packages
      # (add as needed based on experience)
    rebase-strategy: auto
    auto-commit: false
    versioning-strategy: auto

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    reviewers:
      - "Gonza Mendoza"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[INFRA] ci(actions)"
      include: "scope"

# Security Updates (run daily, separate from regular updates)
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: daily
    security-updates-only: true
    pull-request-branch-name:
      separator: "-"
    reviewers:
      - "Gonza Mendoza"
    labels:
      - "security"
      - "dependencies"
      - "auto-merge-candidate"
    commit-message:
      prefix: "[INFRA] fix(security)"
      include: "scope"
    rebase-strategy: auto
