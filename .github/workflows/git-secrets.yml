name: Git Secrets Scan

on:
  pull_request:
    branches: [main, staging, "sprint/*", "feature/*"]
  push:
    branches: [development]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC

jobs:
  secrets:
    name: Scan git history for secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git-secrets

      - name: Configure git for PR
        run: |
          # Scan only new commits in this PR, not entire history
          git fetch origin ${{ github.base_ref }}
          echo "Will scan commits between origin/${{ github.base_ref }} and HEAD"

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets
          sudo make install

      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          git secrets --add -- 'private[_-]?key'
          git secrets --add -- 'api[_-]?key'
          git secrets --add -- 'password\s*='
          git secrets --add -- 'token\s*='
          git secrets --add -- 'secret\s*='
          git secrets --add -- '-----BEGIN (RSA|DSA|EC) PRIVATE KEY-----'

      - name: Load .gitallowed exclusions
        run: |
          if [ -f .gitallowed ]; then
            echo "Loading exclusion patterns from .gitallowed..."
            while IFS= read -r pattern; do
              # Skip empty lines and comments
              [[ -z "$pattern" || "$pattern" == \#* ]] && continue
              echo "Adding allowed pattern: $pattern"
              git secrets --add --allowed -- "$pattern"
            done < .gitallowed
            echo "✅ Exclusion patterns loaded"
          else
            echo "⚠️ .gitallowed not found, skipping exclusions"
          fi

      - name: Scan new commits in PR
        run: |
          # Only scan commits that are new in this PR (not the full history)
          if git log --oneline origin/${{ github.base_ref }}..HEAD | grep -q .; then
            if git diff-index --patch origin/${{ github.base_ref }}..HEAD | git secrets --scan; then
              echo "✅ No secrets found in new commits"
            else
              echo "❌ Secrets detected in new commits!"
              exit 1
            fi
          else
            echo "✅ No new commits to scan"
          fi

      - name: Scan full history (weekly)
        if: github.event_name == 'schedule'
        run: |
          echo "Scanning full git history for secrets..."
          git log -p --all -S 'password' -S 'secret' -S 'key' | head -1000
          echo "Review above output for any accidentally committed secrets"

      - name: Report to Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: '🔴 ALERT: Possible secrets detected in git history. Review immediately.'
          fields: repo,message,commit,author
