name: Git Secrets Scan

on:
  pull_request:
    branches: [main, "sprint/*"]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC

jobs:
  secrets:
    name: Scan git history for secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets
          sudo make install

      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          git secrets --add -- 'private[_-]?key'
          git secrets --add -- 'api[_-]?key'
          git secrets --add -- 'password\s*='
          git secrets --add -- 'token\s*='
          git secrets --add -- 'secret\s*='
          git secrets --add -- '-----BEGIN (RSA|DSA|EC) PRIVATE KEY-----'

      - name: Scan current branch
        run: |
          if git secrets --scan; then
            echo "✅ No secrets found in current commits"
          else
            echo "❌ Secrets detected!"
            exit 1
          fi

      - name: Scan full history (weekly)
        if: github.event_name == 'schedule'
        run: |
          echo "Scanning full git history for secrets..."
          git log -p --all -S 'password' -S 'secret' -S 'key' | head -1000
          echo "Review above output for any accidentally committed secrets"

      - name: Report to Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: '🔴 ALERT: Possible secrets detected in git history. Review immediately.'
          fields: repo,message,commit,author
