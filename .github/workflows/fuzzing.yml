name: Fuzzing Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Daily 2am UTC

jobs:
  fuzz:
    name: Fuzzing on API Endpoints
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bcp_test
          POSTGRES_USER: bcp
          POSTGRES_PASSWORD: bcp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bcp:bcp_test_password@localhost:5432/bcp_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-char
      ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: |
          cd apps/api
          DATABASE_URL=${{ env.DATABASE_URL }} pnpm exec prisma migrate deploy

      - name: Start API
        run: |
          NODE_ENV=test DATABASE_URL=${{ env.DATABASE_URL }} \
          REDIS_URL=${{ env.REDIS_URL }} \
          JWT_SECRET=${{ env.JWT_SECRET }} \
          node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          sleep 5

      - name: Run Fuzzing Tests
        run: |
          echo "Fuzzing API endpoints with random/malformed inputs..."

          # Install fuzzing tool
          npm install -g fast-check-jest

          # Fuzzing: Try malformed JSON
          for i in {1..100}; do
            RANDOM_JSON=$(node -e "console.log(JSON.stringify({random: Math.random()}))")
            curl -X POST http://localhost:3000/campaigns \
              -H "Content-Type: application/json" \
              -d "$RANDOM_JSON" 2>/dev/null | grep -q "error" && echo "✓ Handled malformed input"
          done

          # Fuzzing: Try oversized payloads
          LARGE_PAYLOAD=$(node -e "console.log(JSON.stringify({data: 'x'.repeat(1000000)}))")
          curl -X POST http://localhost:3000/campaigns \
            -H "Content-Type: application/json" \
            -d "$LARGE_PAYLOAD" \
            -w "\nHTTP Status: %{http_code}\n" 2>/dev/null | tail -1

          echo "✅ Fuzzing complete"

      - name: Report findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Fuzzing test discovered issues. Check workflow logs.'
            })
