name: Deploy by Branch

on:
  push:
    branches: [main, staging, development]

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 1

  deploy-dev:
    name: Deploy to Development
    if: github.ref == 'refs/heads/development'
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to development environment
        run: |
          echo "Deploying to development..."
          # TODO: Add your dev deployment command
          # Example: vercel deploy --token ${{ secrets.VERCEL_TOKEN }}
          echo "✅ Development deploy completed"

      - name: Notify team
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "🟢 Development deploy: ${{ job.status }}"
          fields: commit,author,message

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging..."
          # TODO: Add your staging deployment command
          # Example: vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --env=staging
          echo "✅ Staging deploy completed"

      # Real, working smoke test - stays inert (no-op) until STAGING_API_URL
      # is set as a repository/environment variable, since no actual deploy
      # target is wired up above yet. Once it is, this activates automatically:
      # retries with backoff, verifies /health returns 200 + expected shape,
      # fails the job (blocking the "Notify team" step from reporting success)
      # if the newly-deployed instance isn't actually healthy.
      - name: Smoke test - verify deployment is healthy
        if: vars.STAGING_API_URL != ''
        env:
          HEALTH_URL: ${{ vars.STAGING_API_URL }}/health
        run: |
          echo "Checking $HEALTH_URL ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthy after $i attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "##[error]Deployment did not become healthy after 10 attempts (50s). Failing to block a broken deploy from being reported as successful."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Smoke test skipped (no STAGING_API_URL configured yet)
        if: vars.STAGING_API_URL == ''
        run: echo "::warning::Skipping smoke test - set the STAGING_API_URL repository/environment variable once staging has a real deploy target."

      - name: Notify team
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "🟠 Staging deploy: ${{ job.status }}"
          fields: commit,author,message

  deploy-production:
    name: Ready for Production Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # deployment-branch-policy is not a valid inline workflow key - it's a
    # GitHub Environment protection rule, configured via the Environments API
    # (see: repos/.../environments/production) or Settings > Environments.
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify security checks passed
        run: |
          echo "✅ All security checks passed"

      - name: Prepare for production deploy
        run: |
          echo "Build artifacts ready for production deployment"
          echo "Manual deployment required: gh workflow run deploy-prod-manual.yml"

      - name: Create deployment
        run: |
          # Create GitHub deployment (for tracking)
          gh deployment create main \
            --ref ${{ github.sha }} \
            --environment production \
            --auto-merge false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify team
        uses: 8398a7/action-slack@v3
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "📦 Production artifacts ready (awaiting manual deploy)"
          fields: commit,author,message
