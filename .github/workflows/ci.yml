name: CI

on:
  push:
    branches: [main, "sprint/*", "feature/*", development, staging]
  pull_request:
    branches: [main, "sprint/*", "feature/*"]

jobs:
  ci:
    name: Lint / TypeCheck / Test / Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bcp_test
          POSTGRES_USER: bcp
          POSTGRES_PASSWORD: bcp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bcp:bcp_test_password@localhost:5432/bcp_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-char
      ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for hardcoded secrets
        run: |
          # Detect common secrets patterns in source code
          echo "Scanning for hardcoded secrets..."
          ! grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
            -E '(api[_-]?key|password|secret|token|credential)\s*[=:]\s*["\x27]' \
            apps packages providers src | grep -v node_modules | grep -v "\.example\." && \
          echo "✓ No obvious hardcoded secrets found" || echo "⚠ Check above matches manually"

          # Detect .env files in commit (should never happen)
          ! git ls-files | grep -E '^\.env[^.]' && \
          echo "✓ No .env files in git" || exit 1

      - name: Dependency vulnerability scan (Snyk)
        run: pnpm add -g snyk && snyk test --severity-threshold=high
        continue-on-error: true

      - name: Check CISA Known Exploited Vulnerabilities (KEV)
        run: |
          # Download CISA KEV catalog
          curl -s https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o /tmp/kev.json
          # Check if any dependencies are in KEV list
          echo "Scanning for CISA KEV vulnerabilities..."
          # This is a placeholder check; actual implementation requires parsing lockfile
          echo "CISA KEV check configured - implement full integration with sbom-tool"
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Report coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          flags: coverage
